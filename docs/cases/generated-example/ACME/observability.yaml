partner: ACME
requiredAttributes:
- partner.id
- doc.type
- po.number
- correlation.id
alerts:
- name: ACME-sla-breach
  severity: 2
  notify: ops@example.com
  condition: business event 'sent' not seen within 15 minutes of 'received' for the same correlationId
- name: ACME-dlq-not-empty
  severity: 2
  notify: ops@example.com
  condition: dead-letter message count > 0 for 5 minutes on any queue for this partner
- name: ACME-failed-events
  severity: 3
  notify: ops@example.com
  condition: business event 'failed' count > 0 in 15 minutes
dashboardTiles:
- Documents received vs sent (by docType)
- Received -> sent latency vs 15 min SLA
- Failed events by errorCode
- Dead-letter depth by queue
- Recent traces for this partner
