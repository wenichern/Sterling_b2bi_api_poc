openapi: 3.0.3
info:
  title: Orders Gateway API (public, via APIM)
  version: 1.0.0
  description: Partner/internal-facing API published through Azure API Management.
  contact: { name: Integration Team }
servers:
  - url: https://api.example.com/v1
security:
  - oauth2: [orders.read]
paths:
  /orders/{orderId}/status:
    get:
      operationId: getGatewayOrderStatus
      summary: Get order status (sync)
      description: APIM validates the JWT, injects x-correlation-id if absent, and forwards to the WMS status API.
      tags: [orders]
      parameters:
        - name: orderId
          in: path
          required: true
          schema: { type: string }
        - name: x-correlation-id
          in: header
          required: false
          description: Generated by the gateway if absent; always returned in the response.
          schema: { type: string, format: uuid }
      responses:
        '200':
          description: Status
          headers:
            x-correlation-id:
              schema: { type: string, format: uuid }
          content:
            application/json:
              schema: { $ref: '#/components/schemas/OrderStatus' }
        '401': { description: Unauthorized }
        '404': { description: Not found }
        '429': { description: Too many requests }
components:
  securitySchemes:
    oauth2:
      type: oauth2
      flows:
        clientCredentials:
          tokenUrl: https://login.microsoftonline.com/TENANT_ID/oauth2/v2.0/token
          scopes:
            orders.read: Read order status
  schemas:
    OrderStatus:
      type: object
      required: [orderId, status, updatedAt]
      properties:
        orderId: { type: string }
        status: { type: string, enum: [RECEIVED, ALLOCATED, PICKED, SHIPPED, DELIVERED, CANCELLED] }
        updatedAt: { type: string, format: date-time }
        trackingNumber: { type: string }
