name: CI
on:
  pull_request:
  push:
    branches: [main]
permissions:
  contents: read
jobs:
  contracts:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: "3.12" }
      - run: pip install jsonschema pyyaml
      - name: Validate schemas, examples, manifests
        run: python scripts/validate_contracts.py
  openapi-lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: "20" }
      - run: npm install -g @stoplight/spectral-cli
      - run: spectral lint "contracts/openapi/*.yaml" --ruleset .spectral.yaml
  bicep:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Bicep build (skipped if no files yet)
        run: |
          az bicep install
          files=$(find infra -name '*.bicep' 2>/dev/null || true)
          if [ -z "$files" ]; then echo "No Bicep files yet"; exit 0; fi
          for f in $files; do az bicep build --file "$f" --stdout > /dev/null; done
  secret-scan:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with: { fetch-depth: 0 }
      - uses: gitleaks/gitleaks-action@v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
