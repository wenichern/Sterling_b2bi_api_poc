name: edi-bridge
on:
  pull_request:
    paths:
      - "integrations/edi-bridge/**"
      - "contracts/**"
permissions:
  contents: read
jobs:
  check:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: integrations/edi-bridge
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: "20", cache: npm, cache-dependency-path: integrations/edi-bridge/package-lock.json }
      - run: npm ci
      - name: Generated types must match the contracts
        run: |
          npm run gen:types
          git diff --exit-code -- src/generated
      - run: npm run typecheck
      - run: npm test
